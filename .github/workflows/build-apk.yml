name: Build StudyMap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract StudyMap project
        run: |
          mkdir -p source_project
          unzip -o "StudyMap_FocusLock_AllFeatures_Ready.zip" -d source_project

      - name: Create Flutter project
        run: |
          flutter create --project-name learning --org com.studymap temp_project

      - name: Copy StudyMap files
        run: |
          cp source_project/lib/main.dart temp_project/lib/main.dart
          cp source_project/pubspec.yaml temp_project/pubspec.yaml

      - name: Copy Focus Lock files
        run: |
          mkdir -p temp_project/android/app/src/main/java/com/studymap
          mkdir -p temp_project/android/app/src/main/res/xml
          cp source_project/android/app/src/main/java/com/studymap/MainActivity.java temp_project/android/app/src/main/java/com/studymap/MainActivity.java
          cp source_project/android/app/src/main/java/com/studymap/StudyMapAccessibilityService.java temp_project/android/app/src/main/java/com/studymap/StudyMapAccessibilityService.java

      - name: Fix Accessibility XML
        run: |
          python3 -c "from pathlib import Path; p=Path('temp_project/android/app/src/main/res/xml/studymap_accessibility_service.xml'); p.write_text('<accessibility-service xmlns:android=\"http://schemas.android.com/apk/res/android\" android:accessibilityEventTypes=\"typeWindowStateChanged|typeWindowsChanged\" android:accessibilityFeedbackType=\"feedbackGeneric\" android:notificationTimeout=\"100\" android:canRetrieveWindowContent=\"false\" />\n')"

      - name: Configure Android package
        run: |
          sed -i 's/namespace = "com.studymap.learning"/namespace = "com.studymap"/' temp_project/android/app/build.gradle.kts
          sed -i 's/applicationId = "com.studymap.learning"/applicationId = "com.studymap"/' temp_project/android/app/build.gradle.kts

      - name: Configure Google Services
        run: |
          sed -i '/^plugins {/a\    id("com.google.gms.google-services") version "4.4.2" apply false' temp_project/android/settings.gradle.kts
          sed -i '/^plugins {/a\    id("com.google.gms.google-services")' temp_project/android/app/build.gradle.kts

      - name: Add Accessibility Service to Manifest
        run: |
          python3 -c "from pathlib import Path; p=Path('temp_project/android/app/src/main/AndroidManifest.xml'); s=p.read_text(); x='''<service android:name=\"com.studymap.StudyMapAccessibilityService\" android:permission=\"android.permission.BIND_ACCESSIBILITY_SERVICE\" android:exported=\"false\" android:label=\"StudyMap Focus Lock\"><intent-filter><action android:name=\"android.accessibilityservice.AccessibilityService\" /></intent-filter><meta-data android:name=\"android.accessibilityservice\" android:resource=\"@xml/studymap_accessibility_service\" /></service>'''; p.write_text(s.replace('</application>',x+'</application>'))"

      - name: Add Firebase
        working-directory: temp_project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Get dependencies
        working-directory: temp_project
        run: flutter pub get

      - name: Build APK
        working-directory: temp_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMap-APK-FocusLock
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
