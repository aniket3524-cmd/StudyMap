name: Build StudyMap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract StudyMap V2
        run: |
          unzip -o StudyMap_Final_Merge_V2_Firebase_Base.zip -d source

      - name: Create Flutter project
        run: |
          flutter create --project-name studymap_final temp_project

      - name: Copy StudyMap files
        run: |
          cp -r source/lib temp_project/
          cp source/pubspec.yaml temp_project/pubspec.yaml

      - name: Get packages
        working-directory: temp_project
        run: flutter pub get

      - name: Build APK
        working-directory: temp_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMap-APK
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
