name: Build StudyMap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Final Merge project
        run: |
          mkdir source_project
          unzip -o "StudyMap_Final_Merge_V2_Firebase_Base.zip" -d source_project

      - name: Create Flutter Android project
        run: |
          flutter create --project-name learning --org com.studymap temp_project

      - name: Copy StudyMap source files
        run: |
          cp source_project/lib/main.dart temp_project/lib/main.dart
          cp source_project/pubspec.yaml temp_project/pubspec.yaml

      - name: Add Firebase configuration
        working-directory: temp_project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Configure Google Services plugin
        working-directory: temp_project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if "com.google.gms.google-services" not in text:
              marker = 'id("com.android.application") version "'
              pos = text.find(marker)
              if pos != -1:
                  line_end = text.find("\n", pos)
                  text = text[:line_end+1] + '    id("com.google.gms.google-services") version "4.4.2" apply false\n' + text[line_end+1:]

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              marker = 'id("com.android.application")'
              text = text.replace(
                  marker,
                  marker + '\n    id("com.google.gms.google-services")',
                  1
              )

          app.write_text(text)
          PY

      - name: Get Flutter packages
        working-directory: temp_project
        run: flutter pub get

      - name: Build APK
        working-directory: temp_project
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMap-APK
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
