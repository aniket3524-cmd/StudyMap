name: Build StudyMap APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. GitHub repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 3. Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable


      # 4. Extract V5 ZIP
      - name: Extract StudyMap V5
        run: |
          rm -rf source_project
          mkdir -p source_project

          unzip -o "StudyMap_FocusLock_UsageAccess_V5_FIXED.zip" \
            -d source_project

          echo "===== Extracted files ====="
          find source_project -maxdepth 6 -type f | sort


      # 5. Create clean Flutter Android project
      - name: Create Flutter project
        run: |
          rm -rf temp_project

          flutter create \
            --project-name learning \
            --org com.studymap \
            temp_project


      # 6. Copy Flutter source
      - name: Copy StudyMap Flutter files
        run: |
          cp source_project/lib/main.dart \
             temp_project/lib/main.dart

          cp source_project/pubspec.yaml \
             temp_project/pubspec.yaml


      # 7. Copy MainActivity
      - name: Copy MainActivity
        run: |
          mkdir -p \
            temp_project/android/app/src/main/java/com/studymap

          cp \
            source_project/android/app/src/main/java/com/studymap/MainActivity.java \
            temp_project/android/app/src/main/java/com/studymap/MainActivity.java


      # 8. Copy FocusMonitorService
      - name: Copy FocusMonitorService
        run: |
          cp \
            source_project/android/app/src/main/java/com/studymap/FocusMonitorService.java \
            temp_project/android/app/src/main/java/com/studymap/FocusMonitorService.java


      # 9. Fix package name
      - name: Configure Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "temp_project/android/app/build.gradle.kts"
          )

          s = p.read_text()

          s = s.replace(
              'namespace = "com.studymap.learning"',
              'namespace = "com.studymap"'
          )

          s = s.replace(
              'applicationId = "com.studymap.learning"',
              'applicationId = "com.studymap"'
          )

          p.write_text(s)
          PY


      # 10. Add Firebase Google Services plugin
      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # settings.gradle.kts
          p = Path(
              "temp_project/android/settings.gradle.kts"
          )

          s = p.read_text()

          if "com.google.gms.google-services" not in s:
              s = s.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services") version "4.4.2" apply false""",
                  1
              )

          p.write_text(s)


          # app/build.gradle.kts
          p = Path(
              "temp_project/android/app/build.gradle.kts"
          )

          s = p.read_text()

          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  """plugins {
              id("com.google.gms.google-services")""",
                  1
              )

          p.write_text(s)
          PY


      # 11. Add Firebase config
      - name: Add Firebase configuration
        working-directory: temp_project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICES_JSON secret is missing."
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          echo "Firebase configuration added."


      # 12. Create VALID AndroidManifest.xml
      - name: Configure AndroidManifest
        run: |
          cat > temp_project/android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <application
                  android:label="StudyMap"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name="com.studymap.FocusMonitorService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">

                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="StudyMap Focus Lock monitoring" />

                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT"/>
                      <data android:mimeType="text/plain"/>
                  </intent>
              </queries>

          </manifest>
          EOF

          echo "===== AndroidManifest.xml ====="
          cat temp_project/android/app/src/main/AndroidManifest.xml


      # 13. Check Java files
      - name: Check native Android files
        run: |
          echo "===== MainActivity.java ====="
          cat temp_project/android/app/src/main/java/com/studymap/MainActivity.java

          echo "===== FocusMonitorService.java ====="
          cat temp_project/android/app/src/main/java/com/studymap/FocusMonitorService.java


      # 14. Get Flutter dependencies
      - name: Flutter Pub Get
        working-directory: temp_project
        run: |
          flutter pub get


      # 15. Build APK
      - name: Build StudyMap APK
        working-directory: temp_project
        run: |
          flutter build apk --release


      # 16. Upload APK
      - name: Upload StudyMap APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMap-FocusLock-V5-UsageAccess
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
